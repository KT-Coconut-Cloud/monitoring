# KT Cloud 모니터링 VM (Rocky 8.10, 2vCore / 4GB)
# 외부에 열리는 포트는 caddy 443 하나뿐이다. 나머지는 내부 네트워크(mon)에서만 통신한다.
# 이미지 버전은 고정해 두었다. 올릴 때는 이 파일의 태그만 바꾸면 된다.
name: monitoring

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      INGEST_USER: ${INGEST_USER}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
      INGEST_PASS_HASH: ${INGEST_PASS_HASH}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./caddy/certs/server.crt:/certs/server.crt:ro,z
      - ./caddy/certs/server.key:/certs/server.key:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [prometheus, loki, grafana]
    mem_limit: 128m
    networks: [mon]

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-10GB}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus/rules:/etc/prometheus/rules:ro,z
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    networks: [mon]

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro,z
      - loki_data:/loki
    mem_limit: 768m
    networks: [mon]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro,z
      - alertmanager_data:/alertmanager
    mem_limit: 128m
    networks: [mon]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      CW_ACCESS_KEY: ${CW_ACCESS_KEY:-}
      CW_SECRET_KEY: ${CW_SECRET_KEY:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    mem_limit: 512m
    networks: [mon]

  # 이 VM 자체 감시용 (호스트 네트워크로 띄워야 NIC/디스크 값이 호스트 기준으로 나온다)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    security_opt:
      - label=disable
    mem_limit: 64m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m
    networks: [mon]

networks:
  mon: {}

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  loki_data:
  alertmanager_data:
  grafana_data:
